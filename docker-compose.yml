services:
  ds2api:
    image: ghcr.io/ouqiting/ds2api:latest
    container_name: ds2api
    restart: always
    env_file:
      # Optional: a fresh clone has no .env yet and Compose treats a missing
      # env_file as a hard error, which blocked `docker compose up -d` before
      # the first `cp .env.example .env`. Compose >= 2.24 supports
      # `required: false`, so the defaults below still apply.
      - path: .env
        required: false
    ports:
      # Host port is configurable via DS2API_HOST_PORT; container port stays fixed at 5001.
      - "${DS2API_HOST_PORT:-6011}:5001"
    volumes:
      - ./config.json:/data/config.json   # 配置文件（持久化推荐路径）
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DS2API_ADMIN_KEY=${DS2API_ADMIN_KEY:-ds2api}
      - DS2API_CONFIG_PATH=/data/config.json
