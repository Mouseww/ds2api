# DS2API 开发环境配置
# 特性：
#   - 源代码挂载（热重载）
#   - 调试日志级别
#   - 自动重启
#
# 使用说明：
#   docker-compose -f docker-compose.dev.yml up -d --build
#
# 前端界面在镜像构建阶段（Dockerfile 的 dev 阶段）编译，容器内通过
# DS2API_STATIC_ADMIN_DIR 指向镜像里的构建产物。因为 ./:/app 绑定挂载会
# 遮挡 /app/static/admin，所以前端改动需要重新构建镜像才会生效。

services:
  ds2api:
    build:
      context: .
      target: dev
    image: ds2api:dev
    container_name: ds2api-dev
    command: ["go", "run", "./cmd/ds2api"]
    ports:
      # Host port is configurable via DS2API_HOST_PORT; container port stays fixed at 5001.
      - "${DS2API_HOST_PORT:-6011}:5001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - LOG_LEVEL=DEBUG
      # Serve the admin UI built during `docker compose build` (see the Dockerfile
      # `dev` stage). The ./:/app bind mount hides /app/static/admin, so without
      # this the container would fall back to whatever stale build sits on the host.
      # Rebuild the UI with: docker compose -f docker-compose.dev.yml up -d --build
      - DS2API_STATIC_ADMIN_DIR=/opt/ds2api-static/admin
    volumes:
      # 源代码挂载（开发时实时生效）
      - ./:/app
      # 配置文件挂载（便于本地修改）
      - ./config.json:/app/config.json
    restart: "no"
    stdin_open: true
    tty: true
