# DS2API 开发环境配置
# 特性：
#   - 源代码挂载（热重载）
#   - 调试日志级别
#   - 自动重启
#
# 使用说明：
#   docker compose -f docker-compose.dev.yml up -d
#
# ⚠ 关键：项目名固定为 ds2api-dev，与生产项目 ds2api 强制隔离。
#   否则 compose 会把两个文件当成同一个项目，重建时杀掉生产容器，
#   并生成 <hash>_ds2api-dev 孤儿容器（历史故障根因）。
#
# ⚠ 关键：宿主端口用独立变量 DS2API_DEV_HOST_PORT（默认 16011）。
#   不要复用 DS2API_HOST_PORT —— .env 里它是 6011，会与生产端口撞车。
#
# ⚠ 关键：build target 固定为 go-builder，本机开发镜像只带 Go、不含 node，
#   所以 admin UI 不由镜像构建，而是宿主构建后经 ./:/app 绑定挂载生效
#   （容器内解析到 /app/static/admin）。
#   前端改动后的构建命令（vite.config.js 已固定 outDir=../static/admin、base=/admin/）：
#     npm run build --prefix webui
#   后端改动由挂载源码实时生效，部署 = docker restart ds2api-dev。

name: ds2api-dev

services:
  ds2api:
    build:
      context: .
      target: go-builder
    image: ds2api:dev
    container_name: ds2api-dev
    command: ["go", "run", "./cmd/ds2api"]
    ports:
      # 宿主端口独立变量；容器内端口固定 5001
      - "${DS2API_DEV_HOST_PORT:-16011}:5001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - LOG_LEVEL=DEBUG
    volumes:
      # 源代码挂载（开发时实时生效）
      - ./:/app
      # 配置文件挂载（便于本地修改）
      - ./config.json:/app/config.json
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - default
      - warp_net

networks:
  warp_net:
    name: grok2api_default
    external: true
